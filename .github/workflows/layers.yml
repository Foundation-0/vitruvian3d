name: Replay independent switching layers
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  layers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - run: python -m pip install sympy==1.14.0 mpmath==1.3.0
      - name: Verify the continuum path, layer composition and independent review
        run: |
          python research/volume_path_certificate.py
          python research/volume_layer_certificate.py
          python research/connectors_layer_review.py
          git diff --exit-code -- research/volume_path_certificate.json research/volume_layer_certificate.json research/connectors_layer_review.json

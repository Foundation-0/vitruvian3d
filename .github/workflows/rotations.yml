name: Replay rotating motif mechanisms
on:
  pull_request:
    paths:
      - 'research/rotations/**'
      - '.github/workflows/rotations.yml'
  push:
    branches: [main]
    paths:
      - 'research/rotations/**'
      - '.github/workflows/rotations.yml'
permissions:
  contents: read
jobs:
  rotations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - name: Exact certificates and independent stored-frame audit
        run: |
          python research/rotations/certificate.py
          python research/rotations/single_platform.py
          python research/rotations/open_patch_review.py
          python research/rotations/numerics/vacancy_stress_verify.py
          python research/rotations/numerics/finite_branch_audit.py
          git diff --exit-code -- research/rotations/certificate.json research/rotations/single_platform.json research/rotations/open_patch_review.json research/rotations/numerics/vacancy_stress_verify.json

name: Replay volume transition certificates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: |
          python research/volume_barrier.py
          python research/volume_path_certificate.py
          python research/connectors_volume_review.py

name: Replay finite connector checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  connectors:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - run: python -m pip install numpy==2.3.5 sympy==1.14.0 mpmath==1.3.0
      - name: Replay exact identities and saved route geometry
        run: |
          python research/connectors_exact.py
          git diff --exit-code -- research/connectors_exact.json
          python research/connectors_verify.py

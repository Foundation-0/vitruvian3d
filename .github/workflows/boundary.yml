name: Replay fixed-boundary identities
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - run: |
          python research/boundary_certificate.py
          python research/connectors_boundary_review.py
